[widget.rate_2]
type = "vinioli/currency-exchange:rate"

[widget.recorder]
type = "noctalia/screen_recorder:recorder"

[widget.spacer_2]
type = "spacer"

[widget.spacer_3]
type = "spacer"

[widget.spacer_4]
type = "spacer"

[widget.spacer_5]
type = "spacer"

[widget.sysmon]
enabled = false

[widget.temp]
visualization = "none"

[widget.todo]
count_mode = "pending"
show_label = false
type = "nightwatch75/todo:todo"

[widget.toggle_2]
