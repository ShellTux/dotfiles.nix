artist_first = true
capsule = true
hide_when_no_media = true
max_length = 150
show_progress = true
title_scroll = "on_hover"

[widget.mpvpaper]
type = "noctalia/mpvpaper:mpvpaper"

[widget.network]
capsule = true
show_label = false

[widget.ocr]
type = "fel/ocr:ocr"

[widget.printer]
